<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Pixel Tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.4"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <g transform="translate(64, 96)">
    <rect x="-2" y="-2" width="44" height="44" rx="10" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <rect x="16" y="16" width="8" height="8" fill="#22d3ee"/>
    <text x="64" y="14" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3">SERVERLESS · OPEN · CLICK · ANALYTICS</text>
    <text x="64" y="78" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Pixel Tracker</text>
    <text x="64" y="120" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#cbd5e1">A 1×1 tracking pixel on Vercel + Upstash Redis.</text>
    <text x="64" y="148" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#cbd5e1">Opens, clicks, campaigns, webhooks &amp; a live dashboard.</text>

    <g transform="translate(64, 180)">
      <g>
        <rect width="124" height="34" rx="17" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9"/>
        <text x="62" y="22" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" text-anchor="middle">Next.js</text>
      </g>
      <g transform="translate(136, 0)">
        <rect width="124" height="34" rx="17" fill="#22c55e" opacity="0.15" stroke="#22c55e"/>
        <text x="62" y="22" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#86efac" text-anchor="middle">Upstash Redis</text>
      </g>
      <g transform="translate(272, 0)">
        <rect width="124" height="34" rx="17" fill="#a78bfa" opacity="0.15" stroke="#a78bfa"/>
        <text x="62" y="22" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#c4b5fd" text-anchor="middle">Vercel</text>
      </g>
    </g>
  </g>

  <g transform="translate(780, 70)" opacity="0.95">
    <rect width="356" height="220" rx="14" fill="#0b1226" stroke="#1e293b"/>
    <text x="20" y="32" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Activity by day</text>

    <line x1="20" x2="336" y1="180" y2="180" stroke="#1e293b"/>
    <line x1="20" x2="336" y1="130" y2="130" stroke="#1e293b"/>
    <line x1="20" x2="336" y1="80" y2="80" stroke="#1e293b"/>

    <g>
      <rect x="36"  y="120" width="14" height="60"  fill="#22d3ee"/>
      <rect x="52"  y="140" width="14" height="40"  fill="#a78bfa"/>

      <rect x="86"  y="100" width="14" height="80"  fill="#22d3ee"/>
      <rect x="102" y="120" width="14" height="60"  fill="#a78bfa"/>

      <rect x="136" y="80"  width="14" height="100" fill="#22d3ee"/>
      <rect x="152" y="110" width="14" height="70"  fill="#a78bfa"/>

      <rect x="186" y="60"  width="14" height="120" fill="#22d3ee"/>
      <rect x="202" y="92"  width="14" height="88"  fill="#a78bfa"/>

      <rect x="236" y="46"  width="14" height="134" fill="#22d3ee"/>
      <rect x="252" y="74"  width="14" height="106" fill="#a78bfa"/>

      <rect x="286" y="32"  width="14" height="148" fill="#22d3ee"/>
      <rect x="302" y="60"  width="14" height="120" fill="#a78bfa"/>
    </g>

    <g transform="translate(20, 198)" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">
      <rect width="10" height="10" fill="#22d3ee"/>
      <text x="14" y="9">opens</text>
      <rect x="64" width="10" height="10" fill="#a78bfa"/>
      <text x="78" y="9">clicks</text>
    </g>
  </g>
</svg>
